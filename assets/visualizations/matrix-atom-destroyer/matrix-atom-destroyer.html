<!DOCTYPE html>
<html>
<head>
<title>Matrix Atom Destroyer</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  color: #00ff66;
  font-family: monospace;
}
canvas { display: block; }
#label {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #00ff66;
  text-shadow: 0 0 10px #00ff66;
  user-select: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">Click to trigger slam destroy</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w, h;
let angle = 0;
let phase = 0;
let slam = 0;
let shockwave = 0;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}

function triggerSlam() {
  phase = 2;
  slam = 1;
  shockwave = 1;
}

function matrixRain() {
  ctx.fillStyle = "#00ff66";
  ctx.font = "14px monospace";

  for (let i = 0; i < 90; i++) {
    const char = Math.random() > 0.5 ? "1" : "0";
    ctx.fillText(char, Math.random() * w, Math.random() * h);
  }
}

function atom() {
  ctx.save();
  ctx.translate(w / 2, h / 2);

  const scale = 1 + slam * 2.5;
  ctx.scale(scale, scale);
  ctx.rotate(angle);

  ctx.strokeStyle = phase === 2 ? "#ff0033" : "#00ff66";
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 18;
  ctx.lineWidth = 3;

  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.ellipse(0, 0, 90, 32, i * Math.PI / 1.5 + angle, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.fillStyle = phase === 2 ? "#ff0033" : "#00e5ff";

  for (let i = 0; i < 40; i++) {
    const spread = phase === 2 ? 160 + slam * 500 : 70;
    const x = Math.cos(angle * 2 + i) * spread * Math.random();
    const y = Math.sin(angle * 3 + i) * spread * Math.random();
    ctx.fillRect(x, y, 4, 4);
  }

  ctx.restore();
}

function drawShockwave() {
  if (shockwave <= 0) return;

  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.strokeStyle = `rgba(255,0,51,${shockwave})`;
  ctx.lineWidth = 6;
  ctx.shadowColor = "#ff0033";
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(0, 0, (1 - shockwave) * Math.max(w, h), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  shockwave -= 0.018;
}

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.fillRect(0, 0, w, h);

  matrixRain();
  atom();
  drawShockwave();

  angle += phase === 2 ? 0.12 : 0.045;

  if (slam > 0) slam -= 0.025;
  if (slam < 0) slam = 0;

  if (phase === 2 && shockwave <= 0 && slam === 0) {
    phase = 0;
  }

  requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);
window.addEventListener("click", triggerSlam);

resize();
draw();
</script>
</body>
</html>
