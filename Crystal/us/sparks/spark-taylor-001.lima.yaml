# Wonderland Spark Runtime
# spark-taylor-001

vmType: "vz"

arch: "aarch64"

cpus: 2

memory: "2GiB"

disk: "10GiB"

images:
  - location: "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-virt-3.20.3-aarch64.iso"

mounts:
  - location: "{{.Dir}}/Crystal/us/workspace/shared"
    mountPoint: "/mnt/shared"
    writable: true

  - location: "{{.Dir}}/Crystal/us/workspace/taylor"
    mountPoint: "/mnt/user"
    writable: true


containerd:
  system: false
  user: true


env:
  WL_SPARK_ID: "spark-taylor-001"
  WL_OWNER: "taylor"
