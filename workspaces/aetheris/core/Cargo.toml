[package]
name = "aetheris-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "wonderland_core"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "boot_test"
path = "src/bin/boot_test.rs"

[dependencies]
bincode = "1.3"
blake3 = "1.5"
libc = "0.2"
uuid = { version = "1.6", features = ["serde", "v4"] }
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }
serde = { version = "1.0", features = ["derive"] }
rkyv = { version = "0.7", features = ["validation"] }

[features]
default = []
python = ["dep:pyo3"]

[[test]]
name = "live_vm_test"
path = "tests/live_vm_test.rs"

