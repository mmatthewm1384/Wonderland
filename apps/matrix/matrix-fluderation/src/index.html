<!doctype html><html><head><meta charset="UTF-8"><title>matrix-fluderation</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070A;font-family:ui-monospace,Menlo,monospace}
canvas{display:block;width:100vw;height:100vh;background:radial-gradient(circle at center,rgba(0,255,102,.14),#05070A 55%,#000)}
#panel{position:fixed;left:14px;top:14px;color:#00E5FF;background:rgba(5,7,10,.72);border:1px solid rgba(0,229,255,.3);padding:12px;width:250px;font-size:12px;z-index:10;backdrop-filter:blur(10px)}
#panel.hidden{display:none}label{display:grid;grid-template-columns:80px 1fr 38px;gap:8px;margin:8px 0}input{width:100%;accent-color:#00E5FF}button{background:rgba(0,229,255,.08);color:#00E5FF;border:1px solid rgba(0,229,255,.35);padding:6px;font:inherit}.hint{color:#00FF66;opacity:.75;margin-top:8px}
</style></head><body>
<div id="panel"><strong>matrix-fluderation</strong><div id="presetName">MODE: emergence</div>
<label>speed<input id="speed" type="range" min=".05" max="1.2" step=".01" value=".24"><span id="speedVal">.24</span></label>
<label>seeds<input id="density" type="range" min="20" max="160" step="1" value="76"><span id="densityVal">76</span></label>
<label>glow<input id="glow" type="range" min=".2" max="1.6" step=".01" value=".86"><span id="glowVal">.86</span></label>
<label>fade<input id="fade" type="range" min=".04" max=".35" step=".01" value=".08"><span id="fadeVal">.08</span></label>
<label>growth<input id="growth" type="range" min=".2" max="2.4" step=".01" value="1.4"><span id="growthVal">1.4</span></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"><button data-preset="emergence">Seed</button><button data-preset="swarm">Swarm</button><button data-preset="oracle">Oracle</button><button data-preset="wonderland">Wonderland</button></div>
<div class="hint">H controls · F fullscreen · P production · C clear · 1 Seed · 2 Swarm · 3 Oracle · 4 Wonderland</div></div>
<canvas id="stage"></canvas><script type="module" src="./main.js"></script></body></html>
