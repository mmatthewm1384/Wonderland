<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Matrix Atom Slam</title>
<style>
:root {
  --bg:#05070A;
  --panel:#0B1018;
  --cyan:#00E5FF;
  --purple:#7000FF;
  --green:#00FF66;
  --danger:#FF3B7A;
  --text:#E9FBFF;
  --muted:#7D8799;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 10%, rgba(112,0,255,.34), transparent 34rem),
    radial-gradient(circle at 80% 80%, rgba(0,229,255,.22), transparent 32rem),
    var(--bg);
}
.shell { width:min(1180px, calc(100vw - 48px)); margin:0 auto; padding:30px 0; }
.topbar,.panel,.stage {
  border:1px solid rgba(0,229,255,.26);
  background:rgba(11,16,24,.90);
  border-radius:24px;
  box-shadow:0 0 34px rgba(0,229,255,.09);
}
.topbar { display:flex; justify-content:space-between; align-items:center; padding:22px 24px; }
.eyebrow { color:var(--green); letter-spacing:.16em; text-transform:uppercase; font-size:12px; margin:0 0 6px; }
h1 { margin:0; color:var(--cyan); font-size:44px; }
.status { color:var(--green); border:1px solid rgba(0,255,102,.6); border-radius:999px; padding:10px 16px; font-weight:800; }
.panel {
  margin-top:18px;
  padding:18px;
  display:grid;
  grid-template-columns:repeat(4, minmax(150px,1fr)) auto;
  gap:14px;
  align-items:end;
}
.control {
  border:1px solid rgba(0,229,255,.12);
  background:rgba(5,7,10,.44);
  border-radius:16px;
  padding:12px;
}
label { display:flex; justify-content:space-between; color:var(--muted); margin-bottom:8px; font-size:12px; }
label span { color:var(--cyan); font-family:"JetBrains Mono",monospace; }
input[type=range], select {
  width:100%;
  accent-color:var(--cyan);
}
select {
  background:#05070A;
  color:var(--text);
  border:1px solid rgba(0,229,255,.25);
  border-radius:12px;
  padding:9px;
}
button {
  border:0;
  border-radius:16px;
  padding:14px 20px;
  min-width:120px;
  color:white;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(135deg,var(--danger),var(--purple),var(--cyan));
  box-shadow:0 0 28px rgba(255,59,122,.18);
}
.stage {
  position:relative;
  margin-top:18px;
  height:610px;
  overflow:hidden;
}
.grid {
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 50% 45%, rgba(255,59,122,.16), transparent 16rem),
    repeating-linear-gradient(90deg, rgba(0,229,255,.055) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(0deg, rgba(112,0,255,.04) 0 1px, transparent 1px 64px);
}
.atom {
  position:absolute;
  left:50%;
  top:48%;
  width:170px;
  height:170px;
  transform:translate(-50%,-50%) scale(1);
  border:2px solid rgba(0,229,255,.72);
  border-radius:50%;
  display:grid;
  place-items:center;
  box-shadow:0 0 48px rgba(0,229,255,.28), inset 0 0 34px rgba(112,0,255,.24);
  transition:transform .6s cubic-bezier(.12,.78,.18,1), box-shadow .6s ease;
}
.atom::before {
  content:"";
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 32px var(--green);
}
.atom.charged {
  transform:translate(-50%,-50%) scale(1.12);
  box-shadow:0 0 80px rgba(0,229,255,.46), inset 0 0 54px rgba(255,59,122,.26);
}
.orbit {
  position:absolute;
  left:50%;
  top:48%;
  width:310px;
  height:108px;
  border:1px solid rgba(0,229,255,.36);
  border-radius:50%;
  transform:translate(-50%,-50%) rotate(var(--rot));
  animation:spin var(--spin,8s) linear infinite;
}
.o2 { --rot:60deg; --spin:11s; border-color:rgba(112,0,255,.42); }
.o3 { --rot:120deg; --spin:14s; border-color:rgba(0,255,102,.34); }
@keyframes spin {
  from { transform:translate(-50%,-50%) rotate(var(--rot)); }
  to { transform:translate(-50%,-50%) rotate(calc(var(--rot) + 360deg)); }
}
.shock {
  position:absolute;
  left:50%;
  top:48%;
  width:40px;
  height:40px;
  border:2px solid rgba(0,229,255,.82);
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.4);
  opacity:0;
  pointer-events:none;
}
.shock.run { animation:shockwave 1.8s ease-out forwards; }
.shock-secondary.run { animation:shockwave 2.4s ease-out .18s forwards; border-color:rgba(112,0,255,.8); }
.shock-tertiary.run { animation:shockwave 3.0s ease-out .34s forwards; border-color:rgba(0,255,102,.72); }
@keyframes shockwave {
  0% { opacity:.95; transform:translate(-50%,-50%) scale(.4); }
  100% { opacity:0; transform:translate(-50%,-50%) scale(18); }
}
.hud {
  position:absolute;
  left:24px;
  top:24px;
  width:320px;
  padding:14px 16px;
  border:1px solid rgba(0,229,255,.24);
  border-radius:16px;
  background:rgba(5,7,10,.72);
  color:var(--cyan);
  font-family:"JetBrains Mono",monospace;
  line-height:1.65;
}
.ledger {
  position:absolute;
  right:24px;
  top:24px;
  width:360px;
  max-height:520px;
  overflow:auto;
  padding:14px;
  border:1px solid rgba(0,229,255,.24);
  border-radius:16px;
  background:rgba(5,7,10,.72);
  font-family:"JetBrains Mono",monospace;
  font-size:12px;
}
.ledger h2 { margin:0 0 10px; color:var(--cyan); font-size:16px; }
.event {
  border-bottom:1px solid rgba(0,229,255,.12);
  padding:9px 0;
}
.event strong { color:var(--green); }
pre {
  white-space:pre-wrap;
  overflow:auto;
  max-height:240px;
  color:var(--green);
  background:rgba(5,7,10,.68);
  border:1px solid rgba(0,229,255,.16);
  border-radius:14px;
  padding:12px;
}
.energy {
  position:absolute;
  left:50%;
  bottom:42px;
  transform:translateX(-50%);
  width:min(620px, 70vw);
  height:18px;
  border-radius:999px;
  background:rgba(125,135,153,.25);
  overflow:hidden;
}
.energy-fill {
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--green),var(--cyan),var(--purple),var(--danger));
  transition:width .35s ease;
}
</style>
</head>
<body>
<section class="shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Wonderland Matrix</p>
      <h1>Atom Slam</h1>
    </div>
    <div id="status" class="status">IMPULSE READY</div>
  </header>

  <section class="panel">
    <div class="control"><label>Preset <span id="vPreset"></span></label>
      <select id="preset">
        <option value="custom">Custom</option>
        <option value="tap">Tap</option>
        <option value="slam">Slam</option>
        <option value="shock">Shock Burst</option>
        <option value="collapse">Core Collapse</option>
        <option value="overdrive">Overdrive</option>
      </select>
    </div>
    <div class="control"><label>Strength <span id="vStrength"></span></label><input id="strength" type="range" min="1" max="100" value="88"></div>
    <div class="control"><label>Charge Rate <span id="vCharge"></span></label><input id="chargeRate" type="range" min="1" max="20" value="8"></div>
    <div class="control"><label>Pulse Count <span id="vPulseCount"></span></label><input id="pulseCount" type="range" min="1" max="8" value="1"></div>
    <div class="control"><label>Impulse Type <span id="vType"></span></label>
      <select id="kind">
        <option value="impulse">Impulse</option>
        <option value="shock">Shock</option>
        <option value="pulse">Pulse</option>
        <option value="collapse">Collapse</option>
      </select>
    </div>
    <div class="control"><label>Target <span id="vTarget"></span></label>
      <select id="target">
        <option value="matrix-fluderation">Fluderation</option>
        <option value="matrix-core">Matrix Core</option>
        <option value="broadcast">Broadcast</option>
      </select>
    </div>
    <button id="chargeBtn">CHARGE</button>
    <button id="slam">SLAM</button>
    <button id="copyJson">COPY JSON</button>
  </section>

  <section class="stage">
    <div class="grid"></div>
    <div class="orbit o1"></div>
    <div class="orbit o2"></div>
    <div class="orbit o3"></div>
    <div id="shock" class="shock"></div>
    <div id="shock2" class="shock shock-secondary"></div>
    <div id="shock3" class="shock shock-tertiary"></div>
    <div id="atom" class="atom"></div>
    <div id="hud" class="hud"></div>
    <div class="ledger">
      <h2>Event Ledger</h2>
      <div id="events"></div>
      <h2>Event Preview</h2>
      <pre id="preview">{}</pre>
    </div>
    <div class="energy"><div id="energy" class="energy-fill"></div></div>
  </section>
</section>

<script>
const $ = id => document.querySelector(id);

const preset = $("#preset");
const strength = $("#strength");
const chargeRate = $("#chargeRate");
const pulseCount = $("#pulseCount");
const kind = $("#kind");
const target = $("#target");
const atom = $("#atom");
const shock = $("#shock");
const shock2 = $("#shock2");
const shock3 = $("#shock3");
const hud = $("#hud");
const events = $("#events");
const energy = $("#energy");
const status = $("#status");
const preview = $("#preview");
let chargeTimer = null;

let charge = 0;
let lastEvent = null;
let armed = false;

function currentPreviewEvent() {
  const event = makeEvent();
  event.payload.preview = true;
  return event;
}

function sync() {
  $("#vPreset").textContent = preset.options[preset.selectedIndex].text;
  $("#vStrength").textContent = strength.value;
  $("#vCharge").textContent = chargeRate.value;
  $("#vPulseCount").textContent = pulseCount.value;
  $("#vType").textContent = kind.value;
  $("#vTarget").textContent = target.value;

  energy.style.width = `${charge}%`;
  atom.classList.toggle("charged", charge > 70);

  hud.innerHTML =
    `ATOM_STATE=${charge >= 100 ? "SATURATED" : charge > 70 ? "CHARGED" : "STABLE"}<br>` +
    `PRESET=${preset.value}<br>` +
    `STRENGTH=${strength.value}<br>` +
    `CHARGE=${Math.round(charge)}%<br>` +
    `PULSES=${pulseCount.value}<br>` +
    `TYPE=${kind.value}<br>` +
    `TARGET=${target.value}<br>` +
    `ARMED=${armed ? "YES" : "NO"}<br>` +
    `LAST_EVENT=${lastEvent ? lastEvent.id : "none"}`;

  preview.textContent = JSON.stringify(lastEvent || currentPreviewEvent(), null, 2);
}

function pulseNode(node) {
  node.classList.remove("run");
  void node.offsetWidth;
  node.classList.add("run");
}

function pulseShock() {
  pulseNode(shock);
  pulseNode(shock2);
  pulseNode(shock3);
}

function setPreset(name) {
  const presets = {
    tap: { strength: 22, chargeRate: 4, pulseCount: 1, kind: "pulse", target: "matrix-fluderation" },
    slam: { strength: 88, chargeRate: 8, pulseCount: 1, kind: "impulse", target: "matrix-fluderation" },
    shock: { strength: 72, chargeRate: 14, pulseCount: 4, kind: "shock", target: "broadcast" },
    collapse: { strength: 100, chargeRate: 20, pulseCount: 3, kind: "collapse", target: "matrix-fluderation" },
    overdrive: { strength: 96, chargeRate: 18, pulseCount: 8, kind: "impulse", target: "broadcast" }
  };

  if (!presets[name]) return;
  const v = presets[name];
  strength.value = v.strength;
  chargeRate.value = v.chargeRate;
  pulseCount.value = v.pulseCount;
  kind.value = v.kind;
  target.value = v.target;
  sync();
}

function makeEvent() {
  const stamp = new Date().toISOString().replaceAll("-", "").replaceAll(":", "").replace(/\.\d{3}Z$/, "Z");
  return {
    id: `evt-matrix-atom-slam-${stamp}`,
    source: "matrix-atom-slam",
    type: kind.value,
    strength: Number(strength.value),
    timestamp: new Date().toISOString(),
    payload: {
      mode: "visual-slam",
      preset: preset.value,
      charge: Math.round(charge),
      pulse_count: Number(pulseCount.value),
      target: target.value
    }
  };
}

function addLedger(event) {
  const row = document.createElement("div");
  row.className = "event";
  row.innerHTML = `<strong>${event.type}</strong> strength=${event.strength}<br>${event.id}<br>target=${event.payload.target}`;
  events.prepend(row);
}

async function copyJson() {
  const payload = JSON.stringify(lastEvent || currentPreviewEvent(), null, 2);
  try {
    await navigator.clipboard.writeText(payload);
    status.textContent = "JSON COPIED";
  } catch {
    status.textContent = "COPY FAILED";
  }
  sync();
}

function downloadEvent(event) {
  const filename = `${event.id}.json`;
  const blob = new Blob([JSON.stringify(event, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);

  alert(`Event created: ${filename}\\n\\nImport/move to:\\n~/Wonderland/vault/08-Operations/matrix/events/incoming`);
}

function startCharge() {
  armed = true;
  status.textContent = "CHARGING";

  if (chargeTimer) clearInterval(chargeTimer);

  chargeTimer = setInterval(() => {
    charge = Math.min(100, charge + Number(chargeRate.value) * .9);
    sync();

    if (charge >= 100) {
      status.textContent = "SATURATED";
      clearInterval(chargeTimer);
      chargeTimer = null;
    }
  }, 180);
}

function slam() {
  if (chargeTimer) {
    clearInterval(chargeTimer);
    chargeTimer = null;
  }

  armed = false;
  charge = Math.min(100, charge + Number(chargeRate.value) * 6);

  let emitted = 0;
  const total = Number(pulseCount.value);

  const timer = setInterval(() => {
    emitted += 1;
    pulseShock();

    const event = makeEvent();
    event.id = `${event.id}-p${emitted}`;
    event.payload.sequence = emitted;
    event.payload.sequence_total = total;

    lastEvent = event;
    addLedger(event);
    downloadEvent(event);

    if (emitted >= total) {
      clearInterval(timer);
      charge = Math.max(0, charge - 45);
      status.textContent = "IMPULSE EMITTED";
      sync();
    }
  }, 420);
}

[strength, chargeRate, pulseCount, kind, target].forEach(el => el.addEventListener("input", sync));
preset.addEventListener("input", () => setPreset(preset.value));
$("#chargeBtn").onclick = startCharge;
$("#slam").onclick = slam;
$("#copyJson").onclick = copyJson;

setInterval(() => {
  charge = Math.min(100, charge + Number(chargeRate.value) * .08);
  sync();
}, 250);

sync();
</script>
</body>
</html>
