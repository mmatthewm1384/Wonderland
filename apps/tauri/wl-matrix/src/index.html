<!doctype html><html><head><meta charset="UTF-8"><title>wl-matrix</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070A;font-family:ui-monospace,Menlo,monospace}
canvas{display:block;width:100vw;height:100vh;background:radial-gradient(circle at center,rgba(112,0,255,.2),#05070A 55%,#000)}
#panel{position:fixed;left:14px;top:14px;color:#00E5FF;background:rgba(5,7,10,.72);border:1px solid rgba(0,229,255,.3);padding:12px;width:250px;font-size:12px;z-index:10;backdrop-filter:blur(10px)}
#panel.hidden{display:none}label{display:grid;grid-template-columns:80px 1fr 38px;gap:8px;margin:8px 0}input{width:100%;accent-color:#00E5FF}button{background:rgba(0,229,255,.08);color:#00E5FF;border:1px solid rgba(0,229,255,.35);padding:6px;font:inherit}.hint{color:#00FF66;opacity:.75;margin-top:8px}
</style></head><body>
<div id="panel"><strong>wl-matrix</strong><div id="presetName">preset: energy</div>
<label>speed<input id="speed" type="range" min=".05" max="1.4" step=".01" value=".36"><span id="speedVal">.36</span></label>
<label>nodes<input id="density" type="range" min="20" max="180" step="1" value="90"><span id="densityVal">90</span></label>
<label>glow<input id="glow" type="range" min=".2" max="1.6" step=".01" value=".95"><span id="glowVal">.95</span></label>
<label>fade<input id="fade" type="range" min=".04" max=".35" step=".01" value=".12"><span id="fadeVal">.12</span></label>
<label>chaos<input id="chaos" type="range" min=".2" max="2.4" step=".01" value="1.3"><span id="chaosVal">1.3</span></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"><button data-preset="energy">Forge</button><button data-preset="collapse">Collapse</button><button data-preset="storm">Reactor</button><button data-preset="wonderland">Wonderland</button></div>
<div class="hint">H controls · F fullscreen · P production · C clear · 1 Forge · 2 Collapse · 3 Reactor · 4 Wonderland</div></div>
<canvas id="stage"></canvas><script type="module" src="./main.js"></script></body></html>
