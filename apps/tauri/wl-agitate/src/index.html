<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Matrix Agitate</title>
<style>
:root {
  --bg:#05070A;
  --panel:#0B1018;
  --cyan:#00E5FF;
  --purple:#7000FF;
  --green:#00FF66;
  --danger:#FF3B7A;
  --text:#E9FBFF;
  --muted:#7D8799;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 10%, rgba(112,0,255,.34), transparent 34rem),
    radial-gradient(circle at 80% 80%, rgba(0,229,255,.22), transparent 32rem),
    var(--bg);
}
.shell { width:min(1180px, calc(100vw - 48px)); margin:0 auto; padding:30px 0; }
.topbar,.panel,.stage {
  border:1px solid rgba(0,229,255,.26);
  background:rgba(11,16,24,.90);
  border-radius:24px;
  box-shadow:0 0 34px rgba(0,229,255,.09);
}
.topbar { display:flex; justify-content:space-between; align-items:center; padding:22px 24px; }
.eyebrow { color:var(--green); letter-spacing:.16em; text-transform:uppercase; font-size:12px; margin:0 0 6px; }
h1 { margin:0; color:var(--cyan); font-size:44px; }
.status { color:var(--green); border:1px solid rgba(0,255,102,.6); border-radius:999px; padding:10px 16px; font-weight:800; }
.panel {
  margin-top:18px;
  padding:18px;
  display:grid;
  grid-template-columns:repeat(5, minmax(140px,1fr));
  gap:14px;
  align-items:end;
}
.control {
  border:1px solid rgba(0,229,255,.12);
  background:rgba(5,7,10,.44);
  border-radius:16px;
  padding:12px;
}
label { display:flex; justify-content:space-between; color:var(--muted); margin-bottom:8px; font-size:12px; }
label span { color:var(--cyan); font-family:"JetBrains Mono",monospace; }
input[type=range], select { width:100%; accent-color:var(--cyan); }
select {
  background:#05070A;
  color:var(--text);
  border:1px solid rgba(0,229,255,.25);
  border-radius:12px;
  padding:9px;
}
button {
  border:0;
  border-radius:16px;
  padding:14px 20px;
  color:white;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
}
.stage {
  position:relative;
  margin-top:18px;
  height:610px;
  overflow:hidden;
}
.grid {
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 50%, rgba(0,229,255,.10), transparent 18rem),
    repeating-linear-gradient(90deg, rgba(0,229,255,.055) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(0deg, rgba(112,0,255,.04) 0 1px, transparent 1px 64px);
}
.hud {
  position:absolute;
  left:24px;
  top:24px;
  width:330px;
  padding:14px 16px;
  border:1px solid rgba(0,229,255,.24);
  border-radius:16px;
  background:rgba(5,7,10,.72);
  color:var(--cyan);
  font-family:"JetBrains Mono",monospace;
  line-height:1.65;
  z-index:20;
}
.wavefield {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
}
.wave {
  position:absolute;
  width:60px;
  height:60px;
  border:2px solid rgba(0,229,255,.72);
  border-radius:50%;
  opacity:.9;
  transform:scale(.2);
  animation:agitate var(--speed,3s) ease-out infinite;
}
.wave:nth-child(2) { animation-delay:.4s; border-color:rgba(112,0,255,.72); }
.wave:nth-child(3) { animation-delay:.8s; border-color:rgba(0,255,102,.72); }
.wave:nth-child(4) { animation-delay:1.2s; border-color:rgba(255,59,122,.64); }
.wave:nth-child(5) { animation-delay:1.6s; }

@keyframes agitate {
  0% { transform:scale(.2) rotate(0deg); opacity:.95; }
  70% { opacity:.42; }
  100% { transform:scale(var(--scale,8)) rotate(var(--rotation,0deg)); opacity:0; }
}

.oscillator {
  position:absolute;
  left:50%;
  top:50%;
  width:90px;
  height:90px;
  transform:translate(-50%,-50%);
  border-radius:22px;
  border:2px solid var(--cyan);
  background:rgba(0,229,255,.10);
  box-shadow:0 0 42px rgba(0,229,255,.3);
  display:grid;
  place-items:center;
  transition:transform .2s linear;
}
.oscillator::after {
  content:"";
  width:30px;
  height:30px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 24px var(--green);
}
.history {
  position:absolute;
  right:24px;
  top:24px;
  width:340px;
  height:120px;
  display:flex;
  align-items:end;
  gap:5px;
  padding:12px;
  border:1px solid rgba(0,229,255,.22);
  border-radius:16px;
  background:rgba(5,7,10,.62);
  z-index:20;
}
.bar {
  flex:1;
  min-width:7px;
  height:8px;
  background:linear-gradient(to top,var(--green),var(--cyan),var(--purple),var(--danger));
  border-radius:999px 999px 0 0;
}
</style>
</head>
<body>
<section class="shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Wonderland Matrix</p>
      <h1>Agitate</h1>
    </div>
    <div id="status" class="status">WAVE READY</div>
  </header>

  <section class="panel">
    <div class="control"><label>Frequency <span id="vFrequency"></span></label><input id="frequency" type="range" min="1" max="100" value="42"></div>
    <div class="control"><label>Amplitude <span id="vAmplitude"></span></label><input id="amplitude" type="range" min="1" max="100" value="64"></div>
    <div class="control"><label>Chaos <span id="vChaos"></span></label><input id="chaos" type="range" min="0" max="100" value="18"></div>
    <div class="control"><label>Damping <span id="vDamping"></span></label><input id="damping" type="range" min="0" max="100" value="28"></div>
    <div class="control">
      <label>Pattern <span id="vPattern"></span></label>
      <select id="pattern">
        <option value="sine">Sine</option>
        <option value="pulse">Pulse</option>
        <option value="burst">Burst</option>
        <option value="chaotic">Chaotic</option>
        <option value="standing">Standing</option>
      </select>
    </div>
    <button id="emit">Emit Wave Event</button>
  </section>

  <section class="stage">
    <div class="grid"></div>
    <div id="hud" class="hud"></div>
    <div id="history" class="history"></div>
    <div class="wavefield">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div id="oscillator" class="oscillator"></div>
    </div>
  </section>
</section>

<script>
const $ = id => document.querySelector(id);

const frequency = $("#frequency");
const amplitude = $("#amplitude");
const chaos = $("#chaos");
const damping = $("#damping");
const pattern = $("#pattern");
const hud = $("#hud");
const status = $("#status");
const oscillator = $("#oscillator");
const history = $("#history");

let t = 0;
let values = [];

function energy() {
  const raw = Number(frequency.value) * Number(amplitude.value) * (1 + Number(chaos.value) / 100);
  return Math.max(1, Math.round(raw * (1 - Number(damping.value) / 160) / 100));
}

function sync() {
  $("#vFrequency").textContent = frequency.value;
  $("#vAmplitude").textContent = amplitude.value;
  $("#vChaos").textContent = chaos.value;
  $("#vDamping").textContent = damping.value;
  $("#vPattern").textContent = pattern.value;

  const speed = Math.max(.7, 5 - Number(frequency.value) / 24);
  const scale = 4 + Number(amplitude.value) / 8;
  const rotation = pattern.value === "chaotic" ? "240deg" : pattern.value === "standing" ? "0deg" : "80deg";

  document.documentElement.style.setProperty("--speed", `${speed}s`);
  document.documentElement.style.setProperty("--scale", scale);
  document.documentElement.style.setProperty("--rotation", rotation);

  const e = energy();
  status.textContent = e > 70 ? "CRITICAL WAVE" : e > 38 ? "AGITATING" : "WAVE READY";

  hud.innerHTML =
    `ROLE=wave-generator<br>` +
    `PATTERN=${pattern.value}<br>` +
    `FREQUENCY=${frequency.value}<br>` +
    `AMPLITUDE=${amplitude.value}<br>` +
    `CHAOS=${chaos.value}<br>` +
    `DAMPING=${damping.value}<br>` +
    `ENERGY=${e}`;

  values.push(e);
  values = values.slice(-28);
  const max = Math.max(1, ...values);
  history.innerHTML = values.map(v => `<div class="bar" style="height:${Math.max(8, Math.round(v / max * 96))}px"></div>`).join("");
}

function animate() {
  t += .08;
  const amp = Number(amplitude.value) / 3;
  const ch = Number(chaos.value) / 100;
  const x = Math.sin(t * Number(frequency.value) / 20) * amp + Math.sin(t * 3.7) * ch * 24;
  const y = Math.cos(t * Number(frequency.value) / 24) * amp + Math.cos(t * 2.4) * ch * 24;
  oscillator.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${x}deg)`;
  requestAnimationFrame(animate);
}

function emitEvent() {
  const e = energy();
  const stamp = new Date().toISOString().replaceAll("-", "").replaceAll(":", "").replace(/\.\d{3}Z$/, "Z");
  const event = {
    id: `evt-matrix-agitate-${stamp}`,
    source: "matrix-agitate",
    type: "wave",
    strength: e,
    timestamp: new Date().toISOString(),
    payload: {
      target: "matrix-fluderation",
      pattern: pattern.value,
      frequency: Number(frequency.value),
      amplitude: Number(amplitude.value),
      chaos: Number(chaos.value),
      damping: Number(damping.value)
    }
  };

  const blob = new Blob([JSON.stringify(event, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${event.id}.json`;
  a.click();
  URL.revokeObjectURL(url);

  status.textContent = "WAVE EVENT EXPORTED";
}

[frequency, amplitude, chaos, damping, pattern].forEach(el => el.addEventListener("input", sync));
$("#emit").onclick = emitEvent;

setInterval(sync, 700);
sync();
animate();
</script>
</body>
</html>
