<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>wl-spin-city</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070A;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at center, rgba(112,0,255,0.18) 0%, rgba(5,7,10,0.55) 38%, #000 100%);
    }

    #panel {
      position: fixed;
      left: 14px;
      top: 14px;
      z-index: 10;
      color: #00E5FF;
      background: rgba(5, 7, 10, 0.72);
      border: 1px solid rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.18);
      padding: 12px;
      width: 270px;
      font-size: 12px;
      backdrop-filter: blur(10px);
    }

    #panel.hidden {
      display: none;
    }

    label {
      display: grid;
      grid-template-columns: 92px 1fr 42px;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
    }

    input {
      width: 100%;
      accent-color: #00E5FF;
    }

    button {
      background: rgba(0, 229, 255, 0.08);
      color: #00E5FF;
      border: 1px solid rgba(0, 229, 255, 0.35);
      padding: 6px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: rgba(0, 229, 255, 0.18);
    }

    #presetName {
      color: #00FF66;
      margin-top: 6px;
    }

    .hint {
      opacity: 0.75;
      margin-top: 8px;
      color: #00FF66;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="panel">
    <strong>wl-spin-city controls</strong>
    <div id="presetName">preset: custom</div>

    <label>speed <input id="speed" type="range" min="0.08" max="1.2" step="0.01" value="0.28"><span id="speedVal">0.28</span></label>
    <label>hooks <input id="hooks" type="range" min="12" max="96" step="1" value="44"><span id="hooksVal">44</span></label>
    <label>dots <input id="dots" type="range" min="1" max="12" step="1" value="5"><span id="dotsVal">5</span></label>
    <label>glow <input id="glow" type="range" min="0.2" max="1.6" step="0.01" value="0.82"><span id="glowVal">0.82</span></label>
    <label>fade <input id="fade" type="range" min="0.04" max="0.38" step="0.01" value="0.12"><span id="fadeVal">0.12</span></label>
    <label>curl <input id="curl" type="range" min="0.35" max="2.2" step="0.01" value="1.24"><span id="curlVal">1.24</span></label>
    <label>depth <input id="depth" type="range" min="0.2" max="1.8" step="0.01" value="1.05"><span id="depthVal">1.05</span></label>
    <label>pull <input id="pull" type="range" min="0.2" max="2.4" step="0.01" value="1.2"><span id="pullVal">1.2</span></label>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px;">
      <button data-preset="hypnotic">Hypnotic</button>
      <button data-preset="haunted">Haunted</button>
      <button data-preset="storm">Storm</button>
      <button data-preset="singularity">Singularity</button>
      <button data-preset="abyss">Abyss</button>
      <button data-preset="wonderland">Wonderland</button>
      <button data-preset="oracle">Oracle</button>
      <button id="randomize">Randomize</button>
    </div>

    <div class="hint">H controls · F fullscreen · C clear · S screensaver · P production · 1-7 presets</div>
  </div>

  <canvas id="spin-city"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
