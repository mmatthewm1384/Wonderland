<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spin City Wave iPhone</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05070A;
  color: #00FF66;
  font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif;
  touch-action: none;
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
#hud {
  position: fixed;
  left: env(safe-area-inset-left);
  right: env(safe-area-inset-right);
  bottom: calc(env(safe-area-inset-bottom) + 12px);
  display: flex;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
  font-size: 11px;
  letter-spacing: 1px;
  color: #00FF66;
  text-shadow: 0 0 12px #00FF66;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">TAP: PULSE · DOUBLE TAP: REVERSE · LONG PRESS: RANDOMIZE</div>

<script>
const COLORS = {
  bg: "#05070A",
  cyan: "#00E5FF",
  purple: "#7000FF",
  green: "#00FF66"
};

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: true });

let W = 0, H = 0, cx = 0, cy = 0;
let rings = [];
let rotFactor = 1.05;
let ampFactor = 1.15;
let freqFactor = 1;
let waveFactor = 1.5;
let pulse = 0;
let last = performance.now();
let t = 0;
let lastTap = 0;
let pressTimer = null;

class Ring {
  constructor(baseR, rotDir, color, freq, amp) {
    this.baseR = baseR;
    this.rotDir = rotDir;
    this.angle = Math.random() * Math.PI * 2;
    this.color = color;
    this.baseFreq = freq;
    this.baseAmp = amp;
    this.wavePhase = Math.random() * 10;
  }

  get rotSpeed() { return this.rotDir * 0.0008 * rotFactor; }
  get amp() { return this.baseAmp * ampFactor + pulse * 18; }
  get freq() { return this.baseFreq * freqFactor; }
  get waveSpeed() { return 0.0018 * waveFactor; }

  update(dt) {
    this.angle += this.rotSpeed * dt;
  }

  draw(now) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.angle);

    ctx.strokeStyle = this.color;
    ctx.lineWidth = Math.max(2.2, W * 0.006);
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 18 + pulse * 30;

    ctx.beginPath();

    const steps = 220;
    const dth = Math.PI * 2 / steps;

    for (let i = 0; i <= steps; i++) {
      const th = i * dth;
      const wave = this.amp * Math.sin(this.freq * th + now * this.waveSpeed + this.wavePhase);
      const r = this.baseR + wave;
      const x = r * Math.cos(th);
      const y = r * Math.sin(th);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.floor(window.innerWidth * dpr);
  H = Math.floor(window.innerHeight * dpr);

  canvas.width = W;
  canvas.height = H;

  cx = W / 2;
  cy = H / 2;

  initRings();
}

function initRings() {
  rings = [];

  const maxR = Math.min(W, H) * 0.42;
  const spacing = maxR / 8;
  const colors = [COLORS.cyan, COLORS.green, COLORS.purple];

  for (let i = 0; i < 8; i++) {
    const r = maxR - i * spacing;
    const isOuter = i < 4;
    const rotDir = isOuter ? -1 : 1;
    const color = colors[i % colors.length];
    const freq = 5.5 + i * 0.6;
    const amp = Math.max(10, W * 0.018) + (i % 3) * 3;
    rings.push(new Ring(r, rotDir, color, freq, amp));
  }
}

function drawBG() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "rgba(0,229,255,0.10)";
  ctx.lineWidth = 1;

  const grid = Math.max(36, W * 0.08);
  for (let x = 0; x < W; x += grid) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (let y = 0; y < H; y += grid) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  const grd = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.min(W, H) * 0.28);
  grd.addColorStop(0, "rgba(0,229,255,0.22)");
  grd.addColorStop(0.45, "rgba(112,0,255,0.08)");
  grd.addColorStop(1, "transparent");
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
}

function reverseDirs() {
  for (const r of rings) r.rotDir *= -1;
}

function randomize() {
  for (const r of rings) {
    r.baseFreq = 4 + Math.random() * 9;
    r.baseAmp = 10 + Math.random() * 24;
    r.wavePhase = Math.random() * 20;
    if (Math.random() > 0.5) r.rotDir *= -1;
  }
}

function triggerPulse() {
  pulse = 1;
}

function loop(now) {
  const dt = Math.min(now - last, 50);
  last = now;
  t += dt;

  drawBG();

  for (const ring of rings) {
    ring.update(dt);
    ring.draw(t);
  }

  ctx.strokeStyle = COLORS.green;
  ctx.lineWidth = Math.max(3, W * 0.008);
  ctx.shadowBlur = 30 + pulse * 40;
  ctx.shadowColor = COLORS.green;
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(14, W * 0.03) + pulse * 20, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  if (pulse > 0) pulse *= 0.92;
  if (pulse < 0.01) pulse = 0;

  requestAnimationFrame(loop);
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

canvas.addEventListener("touchstart", e => {
  e.preventDefault();

  const now = Date.now();
  if (now - lastTap < 300) {
    reverseDirs();
  } else {
    triggerPulse();
  }
  lastTap = now;

  pressTimer = setTimeout(() => randomize(), 650);
}, { passive: false });

canvas.addEventListener("touchend", e => {
  e.preventDefault();
  clearTimeout(pressTimer);
}, { passive: false });

canvas.addEventListener("click", triggerPulse);

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
