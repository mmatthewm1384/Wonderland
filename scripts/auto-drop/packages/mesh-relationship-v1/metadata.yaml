schema_version: 1

artifact:
  name: mesh-relationship-v1
  version: 1.0.0
  category: mesh

description: >
  Establish the canonical Crystal Mesh relationship primitive. A relationship
  is an authorized association between participants established by an explicit
  one-time, expiring, Ed25519-signed capability; it is not a global identity.

ownership:
  Crystal Mesh:
    owns:
      - relationship semantics
      - capability lifecycle
      - relationship state machine
      - relationship evidence
      - capability signature verification

  Transport adapters:
    owns:
      - network transport
      - relay queues
      - session establishment

  Crystal:
    owns:
      - durable relationship state
      - durable message state

boundaries:
  - no global identity registry
  - no network transport in the reference implementation
  - no session key agreement in the reference implementation
  - no chat-specific persistence model
  - issuer key is an authority binding, not a global identity

components:
  - builder/python/wlplatform/src/wlplatform/mesh/capability.py
  - builder/python/wlplatform/src/wlplatform/mesh/__init__.py
  - builder/python/wlplatform/src/wlplatform/mesh/relationship.py
  - schema/mesh.capability.v1.json
  - schema/mesh.relationship.v1.json
  - builder/python/wlplatform/tests/test_mesh_relationship.py

verification:
  checks:
    - capability_round_trip_and_signature
    - tampered_capability_rejected
    - capability_single_use
    - capability_expiry
    - self_acceptance_rejected
    - relationship_state_machine
    - cryptographic_relationship_binding

certification:
  evidence_required: true
  issue_certificate: true
