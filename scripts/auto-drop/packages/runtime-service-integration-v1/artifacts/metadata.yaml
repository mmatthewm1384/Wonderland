package:
  id: runtime-service-integration-v1
  version: "1.0.0"
  category: runtime
  name: Runtime Service Integration

description:
  summary: Runtime service target integration
  purpose: >
    Connects runtime commands to dynamic target resolution
    and execution adapters.

governance:
  classification: platform
  approval_required: true

capability:
  domain: runtime
  type: integration

dependencies:
  - runtime-target-registry-v1
  - runtime-target-resolver-v1
  - runtime-adapter-lima-v1

lifecycle:
  install: scripts/install.sh
  verify: scripts/verify.sh
  rollback: scripts/rollback.sh

certification:
  required: true
  evidence:
    - manifest.json
    - metadata.yaml
    - integration-contract.yaml
