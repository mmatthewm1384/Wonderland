services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: wl-torrent-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./gluetun:/gluetun
    env_file:
      - ../../vault/secrets/vpn.env
    environment:
      VPN_SERVICE_PROVIDER: surfshark
      VPN_TYPE: wireguard
      FIREWALL: "on"
      RUN_ON_UNHEALTHY: "kill"
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: wl-torrent-client
    network_mode: "container:wl-torrent-vpn"
    environment:
      PUID: "501"
      PGID: "20"
      TZ: "America/Los_Angeles"
      WEBUI_PORT: "9091"
    volumes:
      - wl-torrent-config:/config
      - wl-torrent-downloads:/downloads
      - ../../vault/data/torrents/watch:/watch
      - ../../vault/data/torrents/quarantine:/quarantine
    restart: unless-stopped

volumes:
  wl-torrent-config:
  wl-torrent-downloads:
