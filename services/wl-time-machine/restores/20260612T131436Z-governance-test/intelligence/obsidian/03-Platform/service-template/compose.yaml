name: wl-service-template

services:
  wl-service-template:
    image: example/image:latest
    container_name: wl-service-template
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - wonderland-services
    volumes:
      - wl-service-template-data:/data
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      wonderland.service: "wl-service-template"
      wonderland.lifecycle: "template"
      wonderland.docs: "docs/service-overview.md"

networks:
  wonderland-services:
    external: true

volumes:
  wl-service-template-data:
    external: true
