services:
  tor:
    image: alpine:3.18
    container_name: wl-anon-tor
    restart: always
    volumes:
      - ./config:/wl-config:ro
      - tor-data:/var/lib/tor
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache tor &&
        exec tor -f /wl-config/torrc
    ports:
      - "9050:9050"
    networks:
      - anon-isolated

volumes:
  tor-data:

networks:
  anon-isolated:
    name: wl-anon-network
    driver: bridge
