services:
  wl-document-cleaner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wl-document-cleaner
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      TMPDIR: /tmp
      TMP: /tmp
      TEMP: /tmp
      AUDIT_DIR: /audit
      PYTHONUNBUFFERED: "1"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - wl-document-cleaner-audit:/audit
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  wl-document-cleaner-audit:
