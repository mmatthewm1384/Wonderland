services:
  scraper:
    image: alpine:3.18
    container_name: wl-anon-scraper
    restart: always
    volumes:
      - .:/app
    working_dir: /app
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache python3 py3-pip &&
        python3 -m venv /tmp/venv &&
        env -u ALL_PROXY -u HTTP_PROXY -u HTTPS_PROXY /tmp/venv/bin/pip install --no-cache-dir -r requirements.txt &&
        export ALL_PROXY=socks5h://wl-anon-tor:9050 &&
        export HTTP_PROXY=socks5h://wl-anon-tor:9050 &&
        export HTTPS_PROXY=socks5h://wl-anon-tor:9050 &&
        exec /tmp/venv/bin/python3 app.py
    networks:
      - anon-isolated

networks:
  anon-isolated:
    external: true
    name: wl-anon-network
