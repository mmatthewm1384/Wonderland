disabled_rules:
  - todo

opt_in_rules:
  - empty_count
  - vertical_whitespace
  - syntactic_sugar
  - closure_spacing
  - redundant_objc_attribute
  - explicit_init
  - modifier_order

included:
  - Synapse

excluded:
  - .build
  - DerivedData
  - Package.swift

line_length:
  warning: 120
  error: 160

file_length:
  warning: 400
  error: 800

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 120
