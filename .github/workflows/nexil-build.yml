name: Nexil Build

on:
  push:
    paths:
      - 'nexil/**'
      - '.github/workflows/nexil-build.yml'
  pull_request:
    paths:
      - 'nexil/**'
      - '.github/workflows/nexil-build.yml'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: nexil
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
