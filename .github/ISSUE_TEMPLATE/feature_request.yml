name: Feature Request
description: Suggest an idea or enhancement for Synapse
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas for Synapse! Please describe your proposal and how it aligns with our local-first, high-performance architecture.
  - type: textarea
    id: problem
    attributes:
      label: Is Your Feature Related to a Problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: Add a new audio filter / UI toggle for...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: Alternatively, we could...
    validations:
      required: false
