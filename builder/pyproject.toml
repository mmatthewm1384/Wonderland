[project]
name = "wlbuilder"
version = "0.2.0"
description = "Wonderland OS image builder"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1"
]

[project.scripts]
wlbuilder = "wlbuilder.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
