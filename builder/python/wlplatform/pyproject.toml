[build-system]
requires = [
    "setuptools>=75",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "wlplatform"
version = "1.1.0"
description = "Wonderland Platform Engine"
requires-python = ">=3.14"

dependencies = [
    "PyYAML>=6.0"
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
