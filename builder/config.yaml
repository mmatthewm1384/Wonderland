builder:
  name: Wonderland Builder
  version: 2

system:
  name: wonderland-os
  version: 0.1.1
  architecture: arm64
  profile: development

disk:
  size: 8G
  partition_table: gpt

image:
  format: raw

artifacts:
  raw: true
  qcow2: true
  vmdk: false

output:
  root: builder/output

paths:
  raw: null
  qcow2: null
  vmware: null
  manifests: null
  logs: null
  cache: null
  tmp: null

profiles:
  development:
    debug: true
    optimize: false

  release:
    debug: false
    optimize: true

migration:
  disk: native
  mount: native

  bootstrap: legacy
  packages: native
  identity: native
  locale: native
  users: native
  networking: native
  bootloader: native
  verify-image: legacy
  cleanup: native
  convert: native
  manifest: legacy

packages:
  kernel: linux-image-arm64
  bootloader: grub-efi-arm64

  base:
    - sudo
    - openssh-server
    - chrony
    - avahi-daemon
    - systemd-resolved
    - locales

user:
  name: wonderland
  shell: /bin/bash

network:
  ssh: true
  avahi: true
  chrony: true

branding:
  hostname: wonderland
