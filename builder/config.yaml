builder:
  name: Wonderland Builder
  version: 2

system:
  name: wonderland-os
  version: 0.1.1
  architecture: arm64
  profile: development

disk:
  size: 8G
  partition_table: gpt

image:
  format: raw

artifacts:
  raw: true
  qcow2: true
  vmdk: false

output:
  root: builder/output

paths:
  raw: builder/output/raw
  qcow2: builder/output/qcow2
  vmware: builder/output/vmware
  manifests: builder/output/manifests
  logs: builder/output/logs
  cache: builder/output/cache
  tmp: builder/output/tmp

profiles:
  development:
    debug: true
    optimize: false

  release:
    debug: false
    optimize: true

migration:
  disk: native
  mount: native

  bootstrap: legacy
  packages: legacy
  identity: legacy
  locale: legacy
  users: legacy
  networking: legacy
  bootloader: legacy
  verify-image: legacy
  cleanup: legacy
  convert: legacy
  manifest: legacy

packages:
  kernel: linux-image-arm64
  bootloader: grub-efi-arm64

  base:
    - sudo
    - openssh-server
    - chrony
    - avahi-daemon
    - systemd-resolved
    - locales

user:
  name: wonderland
  shell: /bin/bash

network:
  ssh: true
  avahi: true
  chrony: true

branding:
  hostname: wonderland
