<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>THE∅MATRIX v0.1</title>
<style>
body{margin:0;background:#05070A;color:#EAF7FF;font-family:Inter,system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#hud{position:fixed;top:18px;left:18px;padding:14px;border:1px solid #00E5FF;background:rgba(5,7,10,.78);box-shadow:0 0 24px rgba(0,229,255,.25);min-width:290px}
button{background:#05070A;color:#00E5FF;border:1px solid #00E5FF;padding:7px 9px;margin:3px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<b>THE∅MATRIX v0.1</b>
<pre id="s"></pre>
<button onclick="pulse('slam')">Atom Slam</button>
<button onclick="pulse('wave')">Agitate</button>
<button onclick="pulse('spin')">Spin</button>
<button onclick="pulse('flude')">Flude</button>
<button onclick="pulse('heal')">Heal</button>
</div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d"),s=document.getElementById("s");
let W,H,t=0,st={energy:.5,pressure:.2,coherence:1,shield:1,rot:0,wave:0,phase:"stable"};
function R(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener("resize",R);R();
const clamp=v=>Math.max(0,Math.min(1,v));
function pulse(k){
 if(k==="slam"){st.energy+=.35;st.pressure+=.14;st.coherence-=.05;st.shield-=.07;st.phase="slam"}
 if(k==="wave"){st.wave+=.35;st.coherence-=.03;st.shield-=.02;st.phase="wave"}
 if(k==="spin"){st.rot+=.35;st.energy+=.06;st.phase="spin"}
 if(k==="flude"){st.pressure+=.35;st.coherence-=.06;st.shield-=.05;st.phase="flude"}
 if(k==="heal"){st.shield+=.22;st.coherence+=.1;st.phase="healing"}
 st.energy=clamp(st.energy);st.pressure=clamp(st.pressure);st.coherence=clamp(st.coherence);st.shield=clamp(st.shield);
}
function poly(cx,cy,r,n,a){x.beginPath();for(let i=0;i<n;i++){let q=a+i*Math.PI*2/n,px=cx+Math.cos(q)*r,py=cy+Math.sin(q)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}
function draw(){
 requestAnimationFrame(draw);t++;
 st.energy*=.992;st.pressure*=.988;st.wave*=.975;st.coherence+=(1-st.coherence)*.004;st.shield+=(1-st.shield)*.002;
 x.clearRect(0,0,W,H);x.fillStyle="#05070A";x.fillRect(0,0,W,H);
 const cx=W/2,cy=H/2,b=Math.min(W,H)*.22,p=Math.sin(t*.025)*18*st.energy;
 x.save();x.translate(cx,cy);x.rotate(st.rot+t*.002);x.translate(-cx,-cy);
 for(let i=0;i<8;i++){let r=b+i*36+p+Math.sin(t*.02+i)*st.wave*32;x.globalAlpha=.16+st.shield*.12;x.strokeStyle=i%2?"#7000FF":"#00E5FF";x.lineWidth=1+st.energy*2;poly(cx,cy,r,6,t*.002*(i+1));x.stroke()}
 x.restore();
 x.globalAlpha=.9;x.fillStyle="#00FF66";x.beginPath();x.arc(cx,cy,8+st.energy*18,0,Math.PI*2);x.fill();
 s.textContent=JSON.stringify({tick:t,phase:st.phase,energy:+st.energy.toFixed(3),pressure:+st.pressure.toFixed(3),coherence:+st.coherence.toFixed(3),shield:+st.shield.toFixed(3)},null,2);
}
draw();
</script>
</body>
</html>
